<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
        }

        #game-wrapper {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <canvas id="gameCanvas" width="288" height="512"></canvas>
    </div>

    <script>
    (() => {
        // =====================================================================
        // CONSTANTS
        // =====================================================================
        const CANVAS_W = 288;
        const CANVAS_H = 512;

        // Physics
        const GRAVITY = 0.4;
        const JUMP_STRENGTH = -7;
        const MAX_FALL_SPEED = 10;

        // Bird
        const BIRD_W = 34;
        const BIRD_H = 24;
        const BIRD_X = 60;
        const BIRD_START_Y = 200;

        // Pipes
        const PIPE_W = 52;
        const PIPE_GAP = 130;
        const PIPE_SPEED = 2.5;
        const PIPE_SPAWN_INTERVAL = 100; // frames
        const PIPE_MIN_TOP = 60;
        const PIPE_MAX_TOP = CANVAS_H - PIPE_GAP - 112 - 60; // leave room for ground and gap

        // Ground
        const GROUND_H = 112;
        const GROUND_Y = CANVAS_H - GROUND_H;
        const GROUND_SPEED = PIPE_SPEED;

        // Game states
        const STATE_READY = 0;
        const STATE_PLAYING = 1;
        const STATE_GAME_OVER = 2;

        // =====================================================================
        // SETUP
        // =====================================================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gameState = STATE_READY;
        let score = 0;
        let bestScore = 0;
        let frameCount = 0;
        let groundOffset = 0;

        // Bird state
        let bird = {
            x: BIRD_X,
            y: BIRD_START_Y,
            velocity: 0,
            rotation: 0,
            wingFrame: 0,
            wingTimer: 0
        };

        // Pipes array
        let pipes = [];

        // Cloud decoration
        let clouds = [
            { x: 50, y: 60, w: 60, h: 25 },
            { x: 180, y: 30, w: 50, h: 20 },
            { x: 120, y: 100, w: 45, h: 18 },
        ];

        // Restart button bounds (set during draw)
        let restartBtnBounds = null;

        // =====================================================================
        // WEB AUDIO SYNTHESIZER (Zero external asset dependencies)
        // =====================================================================
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    audioCtx = new AudioContextClass();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playSound(type) {
            try {
                const actx = getAudioContext();
                if (!actx) return;

                const now = actx.currentTime;

                if (type === 'flap') {
                    const osc = actx.createOscillator();
                    const gain = actx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(420, now);
                    osc.frequency.exponentialRampToValueAtTime(780, now + 0.1);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.connect(gain);
                    gain.connect(actx.destination);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'score') {
                    const osc = actx.createOscillator();
                    const gain = actx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(659.25, now); // E5
                    osc.frequency.setValueAtTime(880, now + 0.08); // A5
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
                    osc.connect(gain);
                    gain.connect(actx.destination);
                    osc.start(now);
                    osc.stop(now + 0.22);
                } else if (type === 'hit') {
                    const osc = actx.createOscillator();
                    const gain = actx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.exponentialRampToValueAtTime(80, now + 0.25);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.connect(gain);
                    gain.connect(actx.destination);
                    osc.start(now);
                    osc.stop(now + 0.25);
                }
            } catch (err) {
                // Audio failure is non-fatal
            }
        }

        // =====================================================================
        // DRAWING FUNCTIONS
        // =====================================================================

        function drawBackground() {
            // Sky gradient
            const skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
            skyGrad.addColorStop(0, '#4EC0CA');
            skyGrad.addColorStop(1, '#71C5CF');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, CANVAS_W, GROUND_Y);

            // Clouds
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            for (const c of clouds) {
                drawCloud(c.x, c.y, c.w, c.h);
            }
        }

        function drawCloud(x, y, w, h) {
            ctx.beginPath();
            ctx.ellipse(x, y, w / 2, h / 2, 0, 0, Math.PI * 2);
            ctx.ellipse(x - w * 0.3, y + h * 0.15, w * 0.3, h * 0.4, 0, 0, Math.PI * 2);
            ctx.ellipse(x + w * 0.3, y + h * 0.1, w * 0.35, h * 0.35, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawGround() {
            // Grass top strip
            ctx.fillStyle = '#73BF2E';
            ctx.fillRect(0, GROUND_Y, CANVAS_W, 14);

            // Grass line detail
            ctx.fillStyle = '#558022';
            ctx.fillRect(0, GROUND_Y, CANVAS_W, 4);

            // Dirt body
            const dirtGrad = ctx.createLinearGradient(0, GROUND_Y + 14, 0, CANVAS_H);
            dirtGrad.addColorStop(0, '#DED895');
            dirtGrad.addColorStop(0.5, '#D9A066');
            dirtGrad.addColorStop(1, '#C4813E');
            ctx.fillStyle = dirtGrad;
            ctx.fillRect(0, GROUND_Y + 14, CANVAS_W, GROUND_H - 14);

            // Scrolling ground texture (small vertical stripes)
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.08)';
            ctx.lineWidth = 2;
            for (let i = -1; i < CANVAS_W / 12 + 2; i++) {
                const gx = (i * 12 - (groundOffset % 12));
                ctx.beginPath();
                ctx.moveTo(gx, GROUND_Y + 14);
                ctx.lineTo(gx - 4, CANVAS_H);
                ctx.stroke();
            }

            // Ground top black line
            ctx.fillStyle = '#000';
            ctx.fillRect(0, GROUND_Y - 1, CANVAS_W, 2);
        }

        function drawPipe(pipe) {
            const capH = 26;
            const capOverhang = 4;

            // --- Top pipe ---
            const topPipeBottom = pipe.topHeight;

            // Pipe body (top)
            drawPipeBody(pipe.x, 0, PIPE_W, topPipeBottom - capH);

            // Pipe cap (top) - at bottom of top pipe
            drawPipeCap(pipe.x - capOverhang, topPipeBottom - capH, PIPE_W + capOverhang * 2, capH);

            // --- Bottom pipe ---
            const bottomPipeTop = pipe.topHeight + PIPE_GAP;

            // Pipe cap (bottom) - at top of bottom pipe
            drawPipeCap(pipe.x - capOverhang, bottomPipeTop, PIPE_W + capOverhang * 2, capH);

            // Pipe body (bottom)
            drawPipeBody(pipe.x, bottomPipeTop + capH, PIPE_W, GROUND_Y - bottomPipeTop - capH);
        }

        function drawPipeBody(x, y, w, h) {
            if (h <= 0) return;

            // Main green fill
            const pipeGrad = ctx.createLinearGradient(x, 0, x + w, 0);
            pipeGrad.addColorStop(0, '#558022');
            pipeGrad.addColorStop(0.2, '#73BF2E');
            pipeGrad.addColorStop(0.5, '#99E13D');
            pipeGrad.addColorStop(0.8, '#73BF2E');
            pipeGrad.addColorStop(1, '#3B5B17');
            ctx.fillStyle = pipeGrad;
            ctx.fillRect(x, y, w, h);

            // Black outline
            ctx.strokeStyle = '#2E4711';
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, w, h);
        }

        function drawPipeCap(x, y, w, h) {
            // Main green fill
            const capGrad = ctx.createLinearGradient(x, 0, x + w, 0);
            capGrad.addColorStop(0, '#558022');
            capGrad.addColorStop(0.15, '#73BF2E');
            capGrad.addColorStop(0.4, '#ADEE53');
            capGrad.addColorStop(0.6, '#99E13D');
            capGrad.addColorStop(0.85, '#73BF2E');
            capGrad.addColorStop(1, '#3B5B17');
            ctx.fillStyle = capGrad;
            ctx.fillRect(x, y, w, h);

            // Black outline
            ctx.strokeStyle = '#2E4711';
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, w, h);
        }

        function drawBird() {
            ctx.save();
            ctx.translate(bird.x + BIRD_W / 2, bird.y + BIRD_H / 2);

            // Rotation based on velocity
            let targetRotation;
            if (gameState === STATE_GAME_OVER) {
                targetRotation = Math.PI / 2; // Nose-dive on death
            } else {
                targetRotation = Math.max(-0.4, Math.min(bird.velocity / MAX_FALL_SPEED * 1.2, Math.PI / 3));
            }
            bird.rotation += (targetRotation - bird.rotation) * 0.15;
            ctx.rotate(bird.rotation);

            // Wing animation
            bird.wingTimer++;
            if (bird.wingTimer > 6) {
                bird.wingTimer = 0;
                bird.wingFrame = (bird.wingFrame + 1) % 3;
            }

            const bx = -BIRD_W / 2;
            const by = -BIRD_H / 2;

            // Body (yellow oval)
            ctx.fillStyle = '#F8E71C';
            ctx.beginPath();
            ctx.ellipse(bx + BIRD_W * 0.45, by + BIRD_H * 0.5, BIRD_W * 0.42, BIRD_H * 0.45, 0, 0, Math.PI * 2);
            ctx.fill();

            // Body outline
            ctx.strokeStyle = '#D5A500';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Belly (lighter)
            ctx.fillStyle = '#FFF5E1';
            ctx.beginPath();
            ctx.ellipse(bx + BIRD_W * 0.42, by + BIRD_H * 0.62, BIRD_W * 0.25, BIRD_H * 0.22, 0, 0, Math.PI * 2);
            ctx.fill();

            // Wing
            ctx.fillStyle = '#E8D44D';
            ctx.beginPath();
            const wingYOffset = [0, -3, 2][bird.wingFrame];
            ctx.ellipse(bx + BIRD_W * 0.3, by + BIRD_H * 0.5 + wingYOffset, BIRD_W * 0.2, BIRD_H * 0.2, -0.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#C8A800';
            ctx.lineWidth = 1;
            ctx.stroke();

            // Eye (white)
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.arc(bx + BIRD_W * 0.7, by + BIRD_H * 0.32, 5.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1;
            ctx.stroke();

            // Pupil
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(bx + BIRD_W * 0.73, by + BIRD_H * 0.34, 2.5, 0, Math.PI * 2);
            ctx.fill();

            // Eye highlight
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.arc(bx + BIRD_W * 0.75, by + BIRD_H * 0.28, 1.2, 0, Math.PI * 2);
            ctx.fill();

            // Beak
            ctx.fillStyle = '#F08030';
            ctx.beginPath();
            ctx.moveTo(bx + BIRD_W * 0.82, by + BIRD_H * 0.42);
            ctx.lineTo(bx + BIRD_W + 2, by + BIRD_H * 0.5);
            ctx.lineTo(bx + BIRD_W * 0.82, by + BIRD_H * 0.6);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#D9531E';
            ctx.lineWidth = 1;
            ctx.stroke();

            // Lower beak
            ctx.fillStyle = '#D9531E';
            ctx.beginPath();
            ctx.moveTo(bx + BIRD_W * 0.82, by + BIRD_H * 0.52);
            ctx.lineTo(bx + BIRD_W, by + BIRD_H * 0.55);
            ctx.lineTo(bx + BIRD_W * 0.82, by + BIRD_H * 0.6);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function drawScore() {
            // Score text with shadow
            ctx.fillStyle = '#000';
            ctx.font = 'bold 40px "Segoe UI", Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(score, CANVAS_W / 2 + 2, 57);
            ctx.fillStyle = '#FFF';
            ctx.fillText(score, CANVAS_W / 2, 55);

            // Score outline for readability
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.strokeText(score, CANVAS_W / 2, 55);
        }

        function drawReadyScreen() {
            // Title
            ctx.fillStyle = '#000';
            ctx.font = 'bold 32px "Segoe UI", Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('Flappy Bird', CANVAS_W / 2 + 2, 107);
            ctx.fillStyle = '#FFF';
            ctx.fillText('Flappy Bird', CANVAS_W / 2, 105);
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1.5;
            ctx.strokeText('Flappy Bird', CANVAS_W / 2, 105);

            // Instruction
            const pulse = Math.sin(frameCount * 0.06) * 0.15 + 0.85;
            ctx.globalAlpha = pulse;
            ctx.fillStyle = '#000';
            ctx.font = 'bold 18px "Segoe UI", Arial, sans-serif';
            ctx.fillText('Click or Press Space', CANVAS_W / 2 + 1, CANVAS_H / 2 + 1);
            ctx.fillStyle = '#FFF';
            ctx.fillText('Click or Press Space', CANVAS_W / 2, CANVAS_H / 2);
            ctx.globalAlpha = 1;

            // Best score
            if (bestScore > 0) {
                ctx.fillStyle = '#FFF';
                ctx.font = '16px "Segoe UI", Arial, sans-serif';
                ctx.fillText('Best: ' + bestScore, CANVAS_W / 2, CANVAS_H / 2 + 35);
            }
        }

        function drawGameOverScreen() {
            // Dark overlay
            ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
            ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

            // Score panel background
            const panelW = 220;
            const panelH = 160;
            const panelX = (CANVAS_W - panelW) / 2;
            const panelY = 120;

            // Panel shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            roundRect(ctx, panelX + 4, panelY + 4, panelW, panelH, 12);
            ctx.fill();

            // Panel
            ctx.fillStyle = '#DEB887';
            roundRect(ctx, panelX, panelY, panelW, panelH, 12);
            ctx.fill();
            ctx.strokeStyle = '#8B6914';
            ctx.lineWidth = 3;
            roundRect(ctx, panelX, panelY, panelW, panelH, 12);
            ctx.stroke();

            // Inner panel
            ctx.fillStyle = '#C4A265';
            roundRect(ctx, panelX + 12, panelY + 12, panelW - 24, panelH - 24, 8);
            ctx.fill();

            // "Game Over" text
            ctx.fillStyle = '#000';
            ctx.font = 'bold 28px "Segoe UI", Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('Game Over', CANVAS_W / 2 + 1, panelY - 12 + 1);
            ctx.fillStyle = '#FF4444';
            ctx.fillText('Game Over', CANVAS_W / 2, panelY - 12);
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1;
            ctx.strokeText('Game Over', CANVAS_W / 2, panelY - 12);

            // Score labels
            ctx.fillStyle = '#5C3D0D';
            ctx.font = '16px "Segoe UI", Arial, sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('Score:', panelX + 28, panelY + 52);
            ctx.fillText('Best:', panelX + 28, panelY + 88);

            // Score values
            ctx.font = 'bold 28px "Segoe UI", Arial, sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(score, panelX + panelW - 28, panelY + 56);
            ctx.fillText(bestScore, panelX + panelW - 28, panelY + 92);

            // Medal for high scores
            if (score >= 10) {
                const medalColor = score >= 40 ? '#FFD700' : score >= 20 ? '#C0C0C0' : '#CD7F32';
                ctx.fillStyle = medalColor;
                ctx.beginPath();
                ctx.arc(panelX + 50, panelY + 120, 14, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.fillStyle = '#000';
                ctx.font = 'bold 11px Arial';
                ctx.textAlign = 'center';
                const medalText = score >= 40 ? '★' : score >= 20 ? '◆' : '●';
                ctx.fillText(medalText, panelX + 50, panelY + 124);
            }

            // Restart button
            const btnW = 140;
            const btnH = 42;
            const btnX = (CANVAS_W - btnW) / 2;
            const btnY = panelY + panelH + 25;

            // Button shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            roundRect(ctx, btnX + 3, btnY + 3, btnW, btnH, 8);
            ctx.fill();

            // Button gradient
            const btnGrad = ctx.createLinearGradient(0, btnY, 0, btnY + btnH);
            btnGrad.addColorStop(0, '#73BF2E');
            btnGrad.addColorStop(1, '#558022');
            ctx.fillStyle = btnGrad;
            roundRect(ctx, btnX, btnY, btnW, btnH, 8);
            ctx.fill();

            ctx.strokeStyle = '#3B5B17';
            ctx.lineWidth = 2;
            roundRect(ctx, btnX, btnY, btnW, btnH, 8);
            ctx.stroke();

            // Button text
            ctx.fillStyle = '#FFF';
            ctx.font = 'bold 20px "Segoe UI", Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('\u25B6 Restart', CANVAS_W / 2, btnY + 28);

            // Store button bounds for click detection
            restartBtnBounds = { x: btnX, y: btnY, w: btnW, h: btnH };
        }

        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.arcTo(x + w, y, x + w, y + r, r);
            ctx.lineTo(x + w, y + h - r);
            ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
            ctx.lineTo(x + r, y + h);
            ctx.arcTo(x, y + h, x, y + h - r, r);
            ctx.lineTo(x, y + r);
            ctx.arcTo(x, y, x + r, y, r);
            ctx.closePath();
        }

        // =====================================================================
        // GAME LOGIC
        // =====================================================================

        function resetGame() {
            bird.y = BIRD_START_Y;
            bird.velocity = 0;
            bird.rotation = 0;
            pipes = [];
            score = 0;
            frameCount = 0;
            groundOffset = 0;
            restartBtnBounds = null;
            gameState = STATE_READY;
        }

        function flap() {
            if (gameState === STATE_READY) {
                gameState = STATE_PLAYING;
            }
            if (gameState === STATE_PLAYING) {
                bird.velocity = JUMP_STRENGTH;
                playSound('flap');
            }
        }

        function spawnPipe() {
            const topHeight = PIPE_MIN_TOP + Math.random() * (PIPE_MAX_TOP - PIPE_MIN_TOP);
            pipes.push({
                x: CANVAS_W + 10,
                topHeight: topHeight,
                scored: false
            });
        }

        function updateBird() {
            bird.velocity += GRAVITY;
            if (bird.velocity > MAX_FALL_SPEED) {
                bird.velocity = MAX_FALL_SPEED;
            }
            bird.y += bird.velocity;

            // Ceiling clamp
            if (bird.y < 0) {
                bird.y = 0;
                bird.velocity = 0;
            }
        }

        function updatePipes() {
            // Spawn new pipes
            if (frameCount % PIPE_SPAWN_INTERVAL === 0) {
                spawnPipe();
            }

            for (let i = pipes.length - 1; i >= 0; i--) {
                const pipe = pipes[i];
                pipe.x -= PIPE_SPEED;

                // Score when bird passes pipe
                if (!pipe.scored && pipe.x + PIPE_W < bird.x) {
                    pipe.scored = true;
                    score++;
                    playSound('score');
                }

                // Remove off-screen pipes
                if (pipe.x + PIPE_W + 10 < 0) {
                    pipes.splice(i, 1);
                }
            }
        }

        function checkCollisions() {
            // Shrink hitbox slightly for fairness
            const hitShrink = 4;
            const bx = bird.x + hitShrink;
            const by = bird.y + hitShrink;
            const bw = BIRD_W - hitShrink * 2;
            const bh = BIRD_H - hitShrink * 2;

            // Ground collision
            if (bird.y + BIRD_H >= GROUND_Y) {
                bird.y = GROUND_Y - BIRD_H;
                return true;
            }

            // Pipe collisions (AABB)
            for (const pipe of pipes) {
                // Top pipe
                if (aabbCollision(bx, by, bw, bh, pipe.x, 0, PIPE_W, pipe.topHeight)) {
                    return true;
                }
                // Bottom pipe
                const bottomTop = pipe.topHeight + PIPE_GAP;
                if (aabbCollision(bx, by, bw, bh, pipe.x, bottomTop, PIPE_W, GROUND_Y - bottomTop)) {
                    return true;
                }
            }

            return false;
        }

        function aabbCollision(x1, y1, w1, h1, x2, y2, w2, h2) {
            return x1 < x2 + w2 &&
                   x1 + w1 > x2 &&
                   y1 < y2 + h2 &&
                   y1 + h1 > y2;
        }

        function gameOver() {
            gameState = STATE_GAME_OVER;
            playSound('hit');
            if (score > bestScore) {
                bestScore = score;
            }
        }

        // =====================================================================
        // MAIN GAME LOOP
        // =====================================================================

        function gameLoop() {
            frameCount++;

            // --- UPDATE ---
            if (gameState === STATE_PLAYING) {
                updateBird();
                updatePipes();
                groundOffset = (groundOffset + GROUND_SPEED) % CANVAS_W;

                if (checkCollisions()) {
                    gameOver();
                }
            } else if (gameState === STATE_READY) {
                // Bird bobs up and down on ready screen
                bird.y = BIRD_START_Y + Math.sin(frameCount * 0.05) * 8;
                groundOffset = (groundOffset + GROUND_SPEED * 0.5) % CANVAS_W;
            }

            // --- DRAW ---
            drawBackground();

            // Draw pipes behind bird
            for (const pipe of pipes) {
                drawPipe(pipe);
            }

            drawGround();
            drawBird();

            if (gameState === STATE_PLAYING || gameState === STATE_GAME_OVER) {
                drawScore();
            }

            if (gameState === STATE_READY) {
                drawReadyScreen();
            }

            if (gameState === STATE_GAME_OVER) {
                drawGameOverScreen();
            }

            requestAnimationFrame(gameLoop);
        }

        // =====================================================================
        // INPUT HANDLING
        // =====================================================================

        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = CANVAS_W / rect.width;
            const scaleY = CANVAS_H / rect.height;

            if (e.type === 'touchstart' || e.type === 'touchend') {
                return {
                    x: (e.changedTouches[0].clientX - rect.left) * scaleX,
                    y: (e.changedTouches[0].clientY - rect.top) * scaleY
                };
            }
            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            };
        }

        function isInsideBtn(coords) {
            if (!restartBtnBounds) return false;
            const b = restartBtnBounds;
            return coords.x >= b.x && coords.x <= b.x + b.w &&
                   coords.y >= b.y && coords.y <= b.y + b.h;
        }

        function handleInteraction(e) {
            e.preventDefault();

            if (gameState === STATE_GAME_OVER) {
                const coords = getCanvasCoords(e);
                if (isInsideBtn(coords)) {
                    resetGame();
                }
                return;
            }

            flap();
        }

        canvas.addEventListener('mousedown', handleInteraction);
        canvas.addEventListener('touchstart', handleInteraction, { passive: false });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.key === ' ') {
                e.preventDefault();
                if (gameState === STATE_GAME_OVER) {
                    resetGame();
                } else {
                    flap();
                }
            }
        });

        // =====================================================================
        // RESPONSIVE SCALING
        // =====================================================================
        function resizeCanvas() {
            const maxH = window.innerHeight * 0.92;
            const maxW = window.innerWidth * 0.95;
            const ratio = CANVAS_W / CANVAS_H;

            let displayH = maxH;
            let displayW = displayH * ratio;

            if (displayW > maxW) {
                displayW = maxW;
                displayH = displayW / ratio;
            }

            canvas.style.width = displayW + 'px';
            canvas.style.height = displayH + 'px';
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // =====================================================================
        // START
        // =====================================================================
        resetGame();
        gameLoop();
    })();
    </script>
</body>
</html>
